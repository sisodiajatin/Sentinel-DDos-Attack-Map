name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

      - name: Build with sentinel secrets
        run: npm run build
        env:
          GEMINI_API_KEY: CI_SENTINEL_GEMINI
          ABUSEIPDB_API_KEY: CI_SENTINEL_ABUSEIPDB
          OTX_API_KEY: CI_SENTINEL_OTX

      - name: Fail if any secret leaked into the client bundle
        run: |
          if grep -rq "CI_SENTINEL_" dist/; then
            echo "::error::A server-side secret was inlined into the browser bundle"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
