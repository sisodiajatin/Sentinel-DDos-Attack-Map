<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SentinelVis - Real-time cybersecurity threat visualization dashboard with AI-powered analysis"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>SentinelVis - Live Threat Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <style>
      body {
        /* Background is handled by the React App component */
        overflow: hidden; /* Prevent scrolling on the main body */
      }
      /* Custom scrollbar for cyber aesthetic */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      :not(.dark) ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }

      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      :not(.dark) ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "recharts": "https://esm.sh/recharts@^3.6.0",
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
          "d3": "https://esm.sh/d3@^7.9.0",
          "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
          "topojson-client": "https://esm.sh/topojson-client@^3.1.0",
          "recharts/": "https://esm.sh/recharts@^3.6.0/"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
